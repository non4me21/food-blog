name: Deploy to Railway

on:
  push:
    branches:
      - master

jobs:
  typecheck:
    name: Type check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodblog
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: foodblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://foodblog:ci@localhost:5432/foodblog
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Migrate
        run: npx drizzle-kit migrate

      - name: Build
        run: npm run build

  approve:
    name: Approve deploy
    needs: [typecheck, build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - run: echo "Approved — Railway will now deploy"
