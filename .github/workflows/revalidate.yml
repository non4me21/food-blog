name: Revalidate scheduled recipes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call revalidate endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sf "$SITE_URL/api/revalidate?secret=$REVALIDATE_SECRET"
