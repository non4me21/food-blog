name: Revalidate scheduled recipes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Call revalidate endpoint
        run: |
          curl -sf "${{ secrets.SITE_URL }}/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}"
